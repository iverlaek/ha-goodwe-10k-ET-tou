# Example Home Assistant dashboard for the GoodWe Time-of-Use integration.
#
# Create a new dashboard (Settings -> Dashboards -> Add dashboard -> New
# dashboard from scratch), open the raw configuration editor and paste this in.
#
# The bundled card is served by the integration and loaded automatically, so no
# extra resources are needed. The entity IDs below assume the default device
# name "GoodWe Time-of-Use"; adjust `prefix` if you renamed the device.

title: GoodWe TOU
views:
  - title: Time of Use
    path: tou
    icon: mdi:battery-clock-outline
    cards:
      - type: custom:goodwe-tou-planner-card
        title: Laadplanning
        price_entity: sensor.average_electricity_price

      - type: entities
        title: Status
        show_header_toggle: false
        entities:
          - entity: switch.goodwe_time_of_use_eco_mode
            name: ECO mode (Time-of-Use active)
          - entity: sensor.battery_state_of_charge
          - entity: sensor.battery_power
          - entity: sensor.average_electricity_price
          - entity: sensor.energy_production_today_remaining
