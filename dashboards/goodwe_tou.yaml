# Example Home Assistant dashboard for the GoodWe Time-of-Use integration.
#
# Create a new dashboard (Settings -> Dashboards -> Add dashboard -> New
# dashboard from scratch), open the raw configuration editor and paste this in.
#
# The bundled card is served by the integration and loaded automatically, so no
# extra resources are needed. The entity IDs below assume the default device
# name "GoodWe Time-of-Use"; adjust `prefix` if you renamed the device.

title: GoodWe TOU
views:
  - title: Time of Use
    path: tou
    icon: mdi:battery-clock-outline
    cards:
      # What today has cost so far and what today is expected to cost in total,
      # based on the P1 meter and the measured consumption profile. It shows a
      # green check or red cross when a change to the four planner windows makes
      # the predicted cost better or worse.
      - type: custom:goodwe-tou-cost-card
        title: Elektriciteitskosten
        import_entity: sensor.p1_meter_energy_import
        export_entity: sensor.p1_meter_energy_export
        price_entity: sensor.average_electricity_price
        # All-in quarter-hour prices from the integration's Tibber sensor; the
        # average entity supplies the taxes/fees adder while it is still empty.
        all_in_price_entity: sensor.goodwe_time_of_use_stroomprijzen
        all_in_average_entity: sensor.akkerv5_electricity_price
        profile_entity: sensor.goodwe_time_of_use_verbruiksprofiel
        soc_entity: sensor.battery_state_of_charge
        capacity_kwh: 24
        min_soc: 20
        charge_kw: 6
        discharge_kw: 6

      - type: custom:goodwe-tou-card
        title: GoodWe Time-of-Use
        soc_entity: sensor.battery_state_of_charge
        hours_back: 24

      # Battery state of charge over the last two days. A built-in card, so no
      # extra resources are needed.
      - type: history-graph
        title: Batterij SOC
        hours_to_show: 48
        entities:
          - entity: sensor.battery_state_of_charge

      - type: custom:goodwe-tou-planner-card
        title: Laadplanning
        price_entity: sensor.average_electricity_price

      # Live "energy display": a big circle whose ring is the battery SOC with
      # the current grid power in the middle (purple while drawing from the
      # grid, green while feeding back), plus two smaller circles for the
      # lowest/highest battery cell temperature and voltage. On a wide screen
      # this lands top-right as the third card.
      - type: custom:goodwe-tou-power-card
        title: GoodWe vermogen
        grid_entity: sensor.meter_active_power_total
        invert_grid: false
        soc_entity: sensor.battery_state_of_charge
        min_temp_entity: sensor.battery_min_cell_temperature
        max_temp_entity: sensor.battery_max_cell_temperature
        min_volt_entity: sensor.battery_min_cell_voltage
        max_volt_entity: sensor.battery_max_cell_voltage

      # PV input, the same "Solar battery input from panels" gauge as on the
      # start screen. Needs the HACS "modern-circular-gauge" frontend card.
      - type: custom:modern-circular-gauge
        entity: sensor.pv_power
        name: Solar battery input from panels
        gauge_type: half
        min: 0
        max: 7500
        needle: false
        header_position: top
        show_state: true
        show_unit: true
        secondary:
          entity: sensor.pv1_power
          min: 0
          max: 2500
          show_gauge: inner
        tertiary:
          entity: sensor.pv2_power
          min: 0
          max: 2500
          show_gauge: inner

      # Live solar power flow with the production forecast overlaid: how the
      # current PV output splits between the house, the battery and the grid,
      # with a dotted line for what the panels are expected to make right now.
      # Needs the HACS "solar-bar-card" frontend card.
      - type: custom:solar-bar-card
        inverter_size: 10
        production_entity: sensor.pv_power
        self_consumption_entity: sensor.house_consumption
        grid_power_entity: sensor.meter_active_power_total
        invert_grid_power: false
        forecast_entity: sensor.power_production_now
        battery_soc_entity: sensor.battery_state_of_charge
        battery_power_entity: sensor.battery_power
        invert_battery_power: true
        battery_capacity: 24
        import_history_entity: sensor.p1_meter_energy_import
        export_history_entity: sensor.p1_meter_energy_export
        production_history_entity: sensor.energy_production_today
        show_header: true
        header_title: Solar
        show_stats: true
        show_legend: true
        color_palette: classic-solar

      # Solar production forecast as a clock (today / tomorrow / remaining),
      # the same card as on the start screen. Needs the HACS
      # "pv-forecast-card" (custom:clock-pv-forecast-card).
      - type: custom:clock-pv-forecast-card
        bar_style: gradient
        bar_type: segmented
        color_thresholds_manual: ""
        date_format: short
        display_mode: relative
        entity_remaining: sensor.energy_production_today_remaining
        entity_today: sensor.energy_production_today
        entity_tomorrow: sensor.energy_production_tomorrow
        gradient_fixed: false
        max_value: 75
        relative_plus_one: false
        remaining_blink: false
        remaining_indicator: marker
        remaining_inverted: false
        remaining_threshold: 41
        scale_mode: fixed
        show_attribute_value: false
        show_tooltips: true

      # Manual charge / discharge. Only visible while the automation is paused
      # (Auto re-check off). They flip the direction of one window - window 4 by
      # default, see the "manual_window" addon option - and leave its start, stop
      # and days alone. Pressing the active direction again switches it off.
      # Needs the HACS "button-card" frontend card.
      - type: conditional
        conditions:
          - entity: switch.goodwe_time_of_use_auto_herberekening
            state_not: "on"
        card:
          type: horizontal-stack
          cards:
            - type: custom:button-card
              entity: button.goodwe_time_of_use_manual_charge
              name: Handmatig laden
              icon: mdi:battery-arrow-up
              show_state: false
              tap_action:
                action: perform-action
                perform_action: button.press
                target:
                  entity_id: button.goodwe_time_of_use_manual_charge
              styles:
                icon:
                  - color: |
                      [[[
                        var p = hass.states['number.goodwe_time_of_use_window_4_power'];
                        return p && Number(p.state) < 0 ? '#4caf50' : 'var(--disabled-text-color)';
                      ]]]
            - type: custom:button-card
              entity: button.goodwe_time_of_use_manual_discharge
              name: Handmatig ontladen
              icon: mdi:battery-arrow-down
              show_state: false
              tap_action:
                action: perform-action
                perform_action: button.press
                target:
                  entity_id: button.goodwe_time_of_use_manual_discharge
              styles:
                icon:
                  - color: |
                      [[[
                        var p = hass.states['number.goodwe_time_of_use_window_4_power'];
                        return p && Number(p.state) > 0 ? '#ff9800' : 'var(--disabled-text-color)';
                      ]]]

      # Day-ahead price card, fed by the integration's Tibber price sensor.
      # Needs the HACS "apexcharts-card" frontend card.
      - type: custom:apexcharts-card
        graph_span: 2d
        span:
          start: day
        now:
          show: true
          label: nu
        header:
          show: true
          show_states: true
          colorize_states: true
          title: Stroomprijs vandaag & morgen (€/kWh)
        update_interval: 5m
        yaxis:
          - id: Prijs
            decimals: 2
        series:
          - entity: sensor.goodwe_time_of_use_stroomprijzen
            name: Tibber
            type: column
            float_precision: 3
            opacity: 1
            stroke_width: 2
            color_threshold:
              - value: -0.1
                color: "#000fff"
              - value: 0
                color: "#00ffd5"
              - value: 0.1
                color: "#ff8000"
              - value: 0.2
                color: "#0080ff"
              - value: 0.3
                color: "#ff2a00"
              - value: 1
                color: "#ff00d4"
            data_generator: |
              return entity.attributes.prices.map((record) => {
                return [new Date(record.time).getTime(), record.price];
              });

      # Retry counter: the older GoodWe Wi-Fi dongle is easily overloaded and
      # sometimes does not confirm a write, so the integration re-sends it. This
      # card is only visible while the dongle needed a re-send today; a healthy
      # dongle keeps the sensor at 0, which hides the card entirely.
      - type: conditional
        conditions:
          - entity: sensor.goodwe_time_of_use_herpogingen
            state_not: "0"
        card:
          type: entities
          title: Herpogingen
          show_header_toggle: false
          entities:
            - entity: sensor.goodwe_time_of_use_herpogingen
              name: Herpogingen vandaag
            - type: attribute
              entity: sensor.goodwe_time_of_use_herpogingen
              attribute: total
              name: Totaal
            - type: attribute
              entity: sensor.goodwe_time_of_use_herpogingen
              attribute: last_time
              name: Laatste herpoging

      - type: custom:goodwe-tou-log-card
        title: Logboek

      # How far reality drifted from the plan, hour by hour, with the weather
      # variables that influence it (outdoor and feels-like temperature, heating
      # degree hours, PV forecast error) and the house-load model learned from it.
      - type: custom:goodwe-tou-deviation-card
        title: Afwijking

      # The measured quarter-hour house load the planner uses instead of the flat
      # standby, split into grid import and export: the real daily "duck curve".
      - type: custom:goodwe-tou-profile-card
        title: Verbruiksprofiel

      - type: entities
        title: Status
        show_header_toggle: false
        entities:
          - entity: button.goodwe_time_of_use_auto_eco_mode
            name: Auto/ECO Mode (automatisch)
          - entity: button.goodwe_time_of_use_manual_override
            name: Manual override (pauzeer automatisering)
          - entity: switch.goodwe_time_of_use_eco_mode
            name: ECO mode (Time-of-Use active)
          - entity: sensor.goodwe_time_of_use_laagste_celspanning
          - entity: sensor.battery_state_of_charge
          - entity: sensor.battery_power
          - entity: sensor.average_electricity_price
          - entity: sensor.energy_production_today_remaining
