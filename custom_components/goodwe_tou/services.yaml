set_windows:
  name: Set windows
  description: >-
    Write an explicit list of Time-of-Use windows to the inverter. Each window
    has a start and a stop time, a signed power percentage (negative charges,
    positive discharges) and an optional set of days. The list is padded to
    four windows and written with read-back verification. Used by the bundled
    planner card.
  fields:
    windows:
      name: Windows
      description: >-
        List of windows. Each item needs start and stop (HH:MM), power
        (-100 charge .. +100 discharge) and may set days (for example "mon").
      required: true
      selector:
        object:

forecast_soc:
  name: Forecast state of charge
  description: >-
    Project the battery state of charge from now until the end of tomorrow,
    following the Time-of-Use windows that are currently on the inverter. The
    house's standby consumption is drawn from the battery too, so the forecast
    shows the real drain. Used by the week card to draw the forecast part of its
    graph. Returns a list of {time, soc} points.
  fields:
    soc_entity:
      name: Battery state of charge entity
      description: Entity reporting the battery state of charge in percent.
      required: false
      selector:
        entity:
          domain: sensor
    capacity_kwh:
      name: Battery capacity (kWh)
      description: Usable battery capacity in kWh.
      required: false
      selector:
        number:
          min: 1
          max: 200
          step: 0.5
          unit_of_measurement: kWh
    power_kw:
      name: Charge/discharge power (kW, legacy)
      description: >-
        Combined charge and discharge power. Used when the separate charge_kw /
        discharge_kw are not set.
      required: false
      selector:
        number:
          min: 0.1
          max: 100
          step: 0.1
          unit_of_measurement: kW
    charge_kw:
      name: Max charge power (kW)
      description: Maximum power the battery may be charged with (AC + DC).
      required: false
      selector:
        number:
          min: 0
          max: 100
          step: 0.1
          unit_of_measurement: kW
    discharge_kw:
      name: Max discharge power (kW)
      description: Maximum power the battery may be discharged with.
      required: false
      selector:
        number:
          min: 0
          max: 100
          step: 0.1
          unit_of_measurement: kW
    standby_kw:
      name: House standby consumption (kW)
      description: >-
        Continuous house load the battery covers in ECO mode. Lowers the
        forecast state of charge in every step.
      required: false
      selector:
        number:
          min: 0
          max: 100
          step: 0.1
          unit_of_measurement: kW
    min_soc:
      name: Minimum state of charge (%)
      description: >-
        Discharging stops here, so the forecast never drops below this value.
      required: false
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
    rte:
      name: Battery round-trip efficiency
      description: >-
        Round-trip efficiency (0.1-1) of the battery, applied when charging so
        the forecast shows the real drain. At 0.85 about 15% of the energy is
        lost.
      required: false
      selector:
        number:
          min: 0.1
          max: 1
          step: 0.01

get_activity:
  name: Get activity log
  description: >-
    Return the log of modifications sent to the inverter, newest first. Each
    entry has a time, an action, the changes and windows that were written, and
    whether the inverter confirmed it. Used by the log card.
  fields:
    limit:
      name: Limit
      description: Maximum number of entries to return.
      required: false
      selector:
        number:
          min: 1
          max: 1000
          step: 1
    window:
      name: Window
      description: Only return entries that concern this Time-of-Use window.
      required: false
      selector:
        number:
          min: 1
          max: 4
          step: 1
    result:
      name: Result
      description: Only return entries with this result.
      required: false
      selector:
        select:
          options:
            - ok
            - error
