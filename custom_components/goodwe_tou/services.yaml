set_cheapest_hours:
  name: Set cheapest hours
  description: >-
    Plan the four Time-of-Use windows from the electricity price forecast:
    charge the battery up to the target state of charge in the cheapest hours
    and discharge in the most expensive ones, then write the result to the
    inverter. Discharging is capped so the battery is not drained too early.
  fields:
    price_entity:
      name: Price entity
      description: >-
        Entity whose `prices` attribute holds the quarter-hourly price
        forecast. Defaults to the configured ENTSO-e price sensor.
      required: false
      selector:
        entity:
          domain: sensor
    soc_entity:
      name: Battery state of charge entity
      description: Entity reporting the battery state of charge in percent.
      required: false
      selector:
        entity:
          domain: sensor
    pv_entity:
      name: PV forecast entity
      description: >-
        Entity reporting the remaining photovoltaic production for today in
        kWh. Counted as a discount on the energy the house would otherwise buy,
        which is why charging cheaply now is worth it.
      required: false
      selector:
        entity:
          domain: sensor
    capacity_kwh:
      name: Battery capacity (kWh)
      description: Usable battery capacity in kWh.
      required: false
      selector:
        number:
          min: 1
          max: 200
          step: 0.5
          unit_of_measurement: kWh
    power_kw:
      name: Charge/discharge power (kW, legacy)
      description: >-
        Combined charge and discharge power. Used when the separate charge_kw /
        discharge_kw are not set.
      required: false
      selector:
        number:
          min: 0.1
          max: 100
          step: 0.1
          unit_of_measurement: kW
    charge_kw:
      name: Max charge power (kW)
      description: Maximum power the battery may be charged with (AC + DC).
      required: false
      selector:
        number:
          min: 0
          max: 100
          step: 0.1
          unit_of_measurement: kW
    discharge_kw:
      name: Max discharge power (kW)
      description: Maximum power the battery may be discharged with.
      required: false
      selector:
        number:
          min: 0
          max: 100
          step: 0.1
          unit_of_measurement: kW
    standby_kw:
      name: House standby consumption (kW)
      description: >-
        Continuous house load the battery covers in ECO mode. Used for the SoC
        forecast and to explain the plan.
      required: false
      selector:
        number:
          min: 0
          max: 100
          step: 0.1
          unit_of_measurement: kW
    export_hours:
      name: Max export duration (hours)
      description: >-
        How long the battery may export to the grid at full discharge power
        before it must be kept for the house. 0 disables the cap.
      required: false
      selector:
        number:
          min: 0
          max: 24
          step: 0.25
          unit_of_measurement: h
    target_soc:
      name: Target state of charge (%)
      description: State of charge to charge up to and discharge down from.
      required: false
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
    min_soc:
      name: Minimum state of charge (%)
      description: State of charge to stop discharging at.
      required: false
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
    pv_factor:
      name: PV credit factor
      description: >-
        Fraction (0-1) of the remaining PV forecast that counts as a discount
        on the energy the house would otherwise buy.
      required: false
      selector:
        number:
          min: 0
          max: 1
          step: 0.05
    rte:
      name: Battery round-trip efficiency
      description: >-
        Round-trip efficiency (0.1-1) of the battery. A cheap hour is only used
        when the charge price divided by the efficiency still beats the price
        bought later; at 0.85 the losses are about 15%.
      required: false
      selector:
        number:
          min: 0.1
          max: 1
          step: 0.01

